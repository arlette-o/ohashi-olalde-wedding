name: Deploy to EC2

on:
  push:
    branches: [main]

# Two pushes in quick succession used to race each other on the box. Let the
# newer one win rather than deploying an older image on top of a newer one.
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # Images are built here, not on EC2. The instance has ~1 GB of RAM, so two
  # `npm ci` runs plus a Vite build sent it into swap and a deploy took >30 min.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: ui
            context: ./frontend
          - service: backend
            context: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Tag with the commit SHA so a deploy is immutable and rollback is
          # just re-running with an older tag; `latest` is a convenience alias.
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest
          # Layer cache lives in the registry, so npm ci is skipped entirely
          # unless package-lock.json actually changed.
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/${{ matrix.service }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # Pull + restart only. No build happens on the box any more, so this
          # is a couple of minutes at worst.
          command_timeout: 10m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            cd ~/ohashi-olalde-wedding
            git pull origin main

            # The job's GITHUB_TOKEN is enough to read packages and expires with
            # the run, so there is no long-lived PAT sitting on the instance.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export IMAGE_TAG
            docker compose pull ui backend
            docker compose up -d

            # Caddy's image never changes, so `up -d` alone won't restart it and
            # a Caddyfile edit would silently not apply. Recreate it explicitly.
            docker compose up -d --force-recreate caddy

            docker logout ghcr.io
            # Old SHA-tagged images accumulate and the root volume is small.
            docker image prune -af --filter "until=168h"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
