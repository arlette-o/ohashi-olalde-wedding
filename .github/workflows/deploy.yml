name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ohashi-olalde-wedding
            git pull origin main
            docker compose up -d --build
            # Caddy's image never changes, so `up -d` alone won't restart it and
            # a Caddyfile edit would silently not apply. Recreate it explicitly.
            docker compose up -d --force-recreate caddy