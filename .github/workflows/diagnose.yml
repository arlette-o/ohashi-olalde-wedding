# Manually-triggered remote hands for the EC2 box. Exists because the deploy
# SSH key lives only in GitHub secrets — there is no local SSH access — so
# when the site goes dark this is the only way to see the machine.
#
# Runs from any branch:  gh workflow run diagnose.yml --ref <branch> -f action=diagnose
name: Diagnose EC2

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diagnose = read-only | cleanup = free disk (caches, logs) | restart = recreate containers | rebuild = prune caches then rebuild"
        required: true
        default: "diagnose"
        type: choice
        options:
          - diagnose
          - cleanup
          - restart
          - rebuild

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -x
            cd ~/ohashi-olalde-wedding

            echo "================ SYSTEM ================"
            uptime
            free -m
            df -h /
            echo "================ GIT ================"
            git log --oneline -3
            git status --short
            echo "================ DOCKER ================"
            docker system df || true
            docker compose ps -a || true
            echo "================ DISK USAGE ================"
            # Biggest directories, so a full disk can be traced to its cause
            # instead of guessed at. -x stays on the root filesystem.
            sudo du -xh --max-depth=1 / 2>/dev/null | sort -h | tail -12 || true
            sudo du -xh --max-depth=1 /var /var/lib /home/ubuntu 2>/dev/null | sort -h | tail -15 || true
            du -sh ~/ohashi-olalde-wedding/.git ~/.npm ~/.cache 2>/dev/null || true
            sudo journalctl --disk-usage || true
            snap list --all 2>/dev/null | awk '/disabled/' || true
            echo "================ CADDY LOGS ================"
            docker compose logs --tail=60 caddy || true
            echo "================ BACKEND LOGS ================"
            docker compose logs --tail=60 backend || true
            echo "================ UI LOGS ================"
            docker compose logs --tail=20 ui || true

            if [ "${{ inputs.action }}" = "cleanup" ]; then
              echo "================ CLEANUP ================"
              df -h /
              # Only throwaway data: build cache, untagged images, old system
              # logs, downloaded package files and npm's download cache. The
              # running containers, their images and the caddy_data volume
              # (Let's Encrypt certs) are untouched.
              docker builder prune -af
              docker image prune -f
              sudo journalctl --vacuum-size=50M
              sudo apt-get clean
              rm -rf ~/.npm/_cacache
              # Snap keeps old revisions of every snap around; drop them.
              snap list --all | awk '/disabled/{print $1, $3}' | while read name rev; do
                sudo snap remove "$name" --revision="$rev"
              done
              df -h /
            fi

            if [ "${{ inputs.action }}" = "restart" ]; then
              echo "================ RESTART ================"
              docker compose up -d --force-recreate
              sleep 10
              docker compose ps
            fi

            if [ "${{ inputs.action }}" = "rebuild" ]; then
              echo "================ PRUNE + REBUILD ================"
              # Reclaims dangling images and build cache from repeated
              # `up -d --build` runs; does not touch named volumes, so the
              # Let's Encrypt certs in caddy_data survive.
              docker system prune -af
              df -h /
              git pull origin main
              docker compose up -d --build
              docker compose up -d --force-recreate caddy
              sleep 10
              docker compose ps
            fi

            echo "================ LOCAL PROBES ================"
            curl -s --max-time 10 -o /dev/null -w "caddy :443 -> %{http_code}\n" -k https://localhost/ || true
            curl -s --max-time 10 http://localhost:80 -o /dev/null -w "caddy :80 -> %{http_code}\n" || true
