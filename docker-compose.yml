services:
  # --- REVERSE PROXY + AUTOMATIC HTTPS ---
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80" # HTTP (ACME challenge + redirect to HTTPS)
      - "443:443" # HTTPS
    volumes:
      # Mount the DIRECTORY, not the file. Docker binds a single-file mount by
      # inode, and git replaces files rather than editing in place, so a
      # file mount silently keeps serving the config from when the container
      # was created. Directory mounts resolve paths live.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data       # persists Let's Encrypt certificates across restarts
      - caddy_config:/config
    depends_on:
      - ui
      - backend
    restart: always

  # --- FRONTEND UI SERVICE ---
  ui:
    # Prebuilt in CI and pulled from GHCR. Building on the EC2 box took ~25 min
    # and OOM-thrashed the instance; the runner does it in ~1 min with layer
    # caching. docker-compose.override.yml restores a local `build:` for dev.
    image: ghcr.io/arlette-o/ohashi-olalde-wedding/ui:${IMAGE_TAG:-latest}
    expose:
      - "80" # Internal only; reached through caddy
    restart: always

  # --- BACKEND API SERVICE ---
  backend:
    image: ghcr.io/arlette-o/ohashi-olalde-wedding/backend:${IMAGE_TAG:-latest}
    expose:
      - "3000" # Internal only; reached through caddy at /api/*
    environment:
      - NODE_ENV=development
      - PORT=3000 # Pin the port the Express app listens on (matches Dockerfile EXPOSE)
      # Seamlessly injects your 3 MongoDB keys straight into memory
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_URL=${MONGO_URL}
      - RESEND_API=${RESEND_API}
    restart: always

volumes:
  caddy_data:
  caddy_config:
