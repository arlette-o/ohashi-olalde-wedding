server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Photos and other static media never change in place (a new photo gets a
    # new filename), so browsers can keep them for a month instead of
    # re-downloading the whole story mosaic on every visit.
    location ~* \.(?:jpe?g|png|webp|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Vite fingerprints everything under /assets/ (index-AbC123.js), so a new
    # build always means a new URL and these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA fallback: React Router owns the URLs, so any path that isn't a
        # real file must serve index.html instead of nginx's 404.
        try_files $uri $uri/ /index.html;
    }
}
